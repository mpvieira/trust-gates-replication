# Configuration for run_experiments.py
#
# Set `enabled: true/false` per PR (or use --prs on the command line to override).
# All eight PRs are enabled (the full study, 15–25 minutes). Set `enabled: false` or use `run --prs ...` to run a subset.
# Paths are relative to the repository clone ($W/azsdk). `env` selects the test-environment
# workaround the package needs: NONE, EVAL (azure-ai-evaluation), COSMOS (azure-cosmos).
# `g4` describes the claim check: a script run at the merge commit and again with `files`
# checked out from the parent commit; or `commands`, a list of shell commands run in the clone.

# Each PR lists its trust hypotheses (id, category = must-hold | may-fail | cannot-guarantee, statement, the gates that
# serve it, and its source); the runner copies them into every gate's evidence record.
#   hypotheses:           H1..Hn are the independent rater's classification (RN, blind, from the PR description only,
#                         2026-10-02; results/classification_rater_RN.md). H0 is standing: the change references only
#                         interfaces that exist (the paper's 'hallucinated interface' failure mode), served by G1.
#   analyst_hypotheses:   A1.. are requirements the analyst (the AI assistant) extracted that the rater did not. They are
#                         NOT blind: written after the diffs and gate results had been seen. They are kept because some G4
#                         checks were derived from them (e.g. #44844's attribution check, from reading the caller).

repo: https://github.com/Azure/azure-sdk-for-python.git
repo_name: Azure/azure-sdk-for-python
clone_depth: 12000
sparse_paths:
- sdk/core/azure-core
- sdk/confidentialledger/azure-confidentialledger
- sdk/confidentialledger/azure-confidentialledger-certificate
- sdk/identity/azure-identity
- sdk/evaluation/azure-ai-evaluation
- sdk/cosmos/azure-cosmos
- eng/tools/azure-sdk-tools
- tools/azure-sdk-tools
setup:          # what `setup` installs from the clone; add packages here when adding a PR from a new SDK package
  editable_packages:
  - sdk/core/azure-core
  - sdk/identity/azure-identity
  - sdk/confidentialledger/azure-confidentialledger-certificate
  - sdk/confidentialledger/azure-confidentialledger
  - sdk/core/azure-core/tests/testserver_tests/coretestserver
  - sdk/cosmos/azure-cosmos
  tools_package_candidates:
  - eng/tools/azure-sdk-tools
  - tools/azure-sdk-tools
  import_check:
  - azure.core
  - azure.confidentialledger
  - azure.cosmos
  - ci_tools
  - devtools_testutils
  nltk_data:
  - punkt
  - punkt_tab
  - wordnet
  - omw-1.4
environments:   # test-environment profiles a PR can name in `env`; `{repo}` expands to the clone path
  NONE:
    env: {}
    pytest_args: []
    preflight:
    - yaml
    - pytest
    - pyflakes
    - cryptography
    - trio
    - aiohttp
  EVAL:
    env:
      PYTHONPATH: '{repo}/sdk/evaluation/azure-ai-evaluation'
    pytest_args: []
    needs_nltk_data: true
    preflight:
    - yaml
    - pytest
    - pyflakes
    - jwt
    - nltk
    - msrest
    - filelock
    - openai
    - pandas
    - httpx
    - ruamel.yaml
    - jinja2
    - azure.storage.blob
  COSMOS:
    env: {}
    pytest_args:
    - --noconftest
    preflight:
    - yaml
    - pytest
    - pyflakes
    - aiohttp
    - azure.cosmos
common_env:     # set for every PR: makes the azure-sdk `test_proxy` fixture a no-op (no proxy download)
  AZURE_TEST_RUN_LIVE: 'true'
  AZURE_SKIP_LIVE_RECORDING: 'true'
scripts:        # gate implementations, relative to gates/ (G4 scripts are named per PR in each PR's g4 block)
  G1: g1_interface.py
  G2_G3: g2_g3_mutation.py
  common: common.py         # shared helpers imported by the two scripts above; not run directly
extra_gates: [] # additional gates, run for every PR after G1/G2/G3; see EXTENDING.md. To enable the shipped example:
#  - id: G5
#    script: example_extra_gate.py   # in gates/; called as: python <script> <repo> <commit> <PR> <outdir>
#    description: TODO/FIXME markers on changed lines
#    record: pr{pr}_G5.json          # the evidence record it writes
gates:          # default selection when --gates is not given; G2 and G3 come from one mutation run
- G1
- G2
- G3
- G4
prs:
- number: 44844
  enabled: true
  commit: 7d26b949
  package: sdk/evaluation/azure-ai-evaluation
  env: EVAL
  suite:
  - tests/unittests/test_logging.py
  hypotheses:
  - id: H0
    category: must-hold
    statement: The change references only modules, symbols and attributes that exist (no hallucinated interfaces)
    gates:
    - G1
    source: standing
  - id: H1
    category: must-hold
    statement: Nested NodeLogManager contexts do not lead to RecursionError during evaluation runs
    gates:
    - G2
    - G3
    - G4
    source: rater
  - id: H2
    category: may-fail
    statement: Chained NodeLogWriter targets are unwrapped with cycle detection
    gates:
    - G2
    - G3
    - G4
    source: rater
  - id: H3
    category: cannot-guarantee
    statement: Unwrapping has a safe fallback to the real streams
    gates:
    - G2
    - G3
    source: rater
  - id: H4
    category: may-fail
    statement: Existing NodeLogWriter instances are reused when streams are already wrapped
    gates:
    - G2
    - G3
    - G4
    source: rater
  analyst_hypotheses:
  - id: A1
    category: must-hold
    statement: Per-run log attribution is preserved across a nesting boundary (reconstructed from the production caller)
    gates:
    - G4
    source: analyst
  g4:
    script: g4_checks_pr44844.py
    files:
    - azure/ai/evaluation/_legacy/_common/_logging.py
    expect: 'after: outer-after attributed to r2; before: attributed to r1'
